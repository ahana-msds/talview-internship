<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Makes site responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub</title>

    <!-- Linking compiled CSS -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- Semantic header -->
    <header>
        <h1>StudyHub</h1>

        <!-- Semantic navigation -->
        <nav>
            <a href="#courses">Courses</a>
            <a href="#register">Register</a>
        </nav>
    </header>

    <!-- Main content -->
    <main>

        <!-- Section for course list -->
        <section id="courses">
            <h2>Available Courses</h2>

            <!-- Table -->
            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Duration</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Data Science</td>
                        <td>6 Months</td>
                    </tr>
                    <tr>
                        <td>Web Development</td>
                        <td>4 Months</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Registration form -->
        <section id="register">
            <h2>Register</h2>

            <form>
                <!-- Text input -->
                <label>
                    Name:
                    <input type="text" required />
                </label>

                <!-- Email input -->
                <label>
                    Email:
                    <input type="email" required />
                </label>

                <!-- Radio buttons inside list -->
                <fieldset>
                    <legend>Select Course</legend>
                    <ul>
                        <li>
                            <input type="radio" name="course" /> Data Science
                        </li>
                        <li>
                            <input type="radio" name="course" /> Web Development
                        </li>
                    </ul>
                </fieldset>

                <button type="submit">Submit</button>
            </form>
        </section>

    </main>

    <!-- Semantic footer -->
    <footer>
        <p>© 2026 StudyHub</p>
    </footer>

</body>

</html>
