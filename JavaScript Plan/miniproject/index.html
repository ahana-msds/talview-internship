<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Weather Simulator</h1>
            <p>Demonstrating JS Concepts</p>
        </header>
        <main>
            <section class="search-section">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g. London, Paris)" />
                <button id="searchBtn">Get Weather</button>
            </section>
            <section id="resultContainer" class="result-container">
                <!-- Weather content injected here -->
                <div class="loader hidden" id="loader"></div>
                <div class="weather-card hidden" id="weatherCard">
                    <h2 id="cityName"></h2>
                    <p class="temp"><span id="tempValue"></span>°C</p>
                    <p id="condition"></p>
                    <small>Humidity: <span id="humidity"></span>%</small>
                </div>
                <div id="errorMessage" class="error hidden"></div>
            </section>
            <section class="history-section">
                <h3>Search History</h3>
                <ul id="historyList"></ul>
                <button id="clearHistoryBtn" class="secondary-btn">Clear History</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
