<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>dom testing practice</title>
</head>

<body>
    <div id="counter-section">
        <button id="incBtn">increment</button>
        <span id="count">0</span>
    </div>

    <div id="todo-section">
        <input id="todo-input" placeholder="add task" />
        <button id="add-todo">add</button>
        <ul id="todo-list"></ul>
    </div>

    <form id="login-form">
        <input id="username" />
        <input id="password" type="password" />
        <button type="submit">login</button>
    </form>

    <div id="modal" class="hidden">modal content</div>
</body>

</html>
